<!doctype html>
<html>
<head>

  <title>Gemini Auto‑Answer – Options</title>
  <style>
    body   { font: 14px/1.4 sans-serif; margin: 2rem; max-width: 700px; }
    input, textarea { width: 100%; padding: .5rem; font: inherit; }
    textarea { resize: vertical; min-height: 10rem; }
    button { margin-top: 1rem; padding: .5rem 1.2rem; }
    .saved { color: green; margin-left: .8rem; }
  </style>
</head>
<body>

  <h2>Gemini API Key</h2>

    placeholder="Paste a concise summary of the book or course material here…"></textarea>

  <button id="save">Save</button><span id="msg" class="saved"></span>

  <script src="options.js"></script>
</body>
</html>
